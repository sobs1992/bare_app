; A game of bare_app's main menu (GAME_NATIVE): a program of its own that
; bare_app starts with its link (src/games/game_ipc.h). An SDL2 game needs
; nothing else: the SDK's SDL2 (APPS_CONFIG bare-app.SDL=y) has the
; "bareapp" video and joystick drivers.
;
; Where: <dir>/<game>.ini or <dir>/<game>/game.ini of GAME_NATIVE_DIRS
; ("/usr/share/bare_app/games /games"): a package installs the first, a game
; copied from a PC to the games partition brings the second. <game> names
; its data directory, <GAME_NATIVE_DATA>/<game> (/data/<game>): HOME,
; XDG_*_HOME and the working directory of the game, made when it starts.
;
; Relative paths are in the ini's directory. In args, dir and [env]:
; {width} {height} the video layer, {lang} bare_app's language (en, ru),
; {data} the data directory, {dir} the ini's directory.

; In the menu (default: <game>)
name = My Game
; The program; must be executable
exe = bin/mygame
; Its arguments: words, "double quotes" keep spaces
args = --fullscreen --lang {lang}
; Working directory (default: the data directory)
;dir = {dir}
; What it needs: the menu says what is missing (as many lines as needed)
needs = data/game.pak

; Shown once the first frame is in ("\n": a new line), hint.ru in Russian
hint = A  jump    B  fire\nF5  minimise    F6 (hold)  quit
hint.ru = A  прыжок    B  огонь\nF5  свернуть    F6 (держать)  выйти
; L2 and R2 change the volume instead of going to the game (default: no)
volume_triggers = no
; The motion sensor (gyro aiming) as the game's mouse: on, with the mouse's
; counts per degree that turn the view as much as the device turned (the
; game's own mouse settings at their defaults; "on" alone: 10), or "off"
; (default: off; the game's controls turn it on or off and set the
; sensitivity). DOOM 3 (m_yaw 0.022 * sensitivity 5): 1 / 0.11 = 9.09
gyro = 9.09

; SDL's bareapp drivers (SDL_BAREAPP_*):
; buttons as keys: up down left right a b x y l1 r1 l2 r2 select start
; menu f1..f6 = SDL's key names (Return, Escape, Space, Left Ctrl, A...)
keys = a=Space, b=Left Ctrl, start=Return, f1=Escape
; the game controller: by labels (A is A), select and f2 back, start and f1
; start, f3 misc1, f4 paddle1; buttons or lefttrigger/righttrigger or none
gamepad = f3=guide, l2=none
; the window in the frame: fit (aspect kept), stretch, integer
scale = fit
; linear or nearest (whole multiples are always nearest)
filter = linear
; frames a second at most, as a vsync (default 60, 0: no limit)
fps = 60

[env]
; anything else the game needs; SDL_VIDEODRIVER, SDL_AUDIODRIVER and
; AUDIODEV (the board's sound card) are set already
SDL_RENDER_DRIVER = software
MYGAME_DATA = {dir}/data

[labels]
; What each control does in the game, shown by it in bare_app's controls
; screen (X on the game's tile; the row of a remapped button shows its new
; button's); [labels.ru] in Russian. Names as in keys, and stick, rstick
stick = walk
rstick = look
a = jump
b = fire
f1 = menu

[labels.ru]
stick = ходьба
rstick = обзор
a = прыжок
b = огонь
f1 = меню
