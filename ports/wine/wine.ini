; wine.ini: a Windows game for bare_app_wine, in the game's directory
; (/games/<game>/wine.ini). Every /games/*/wine.ini is an entry of
; bare_app's menu. This one is for Sid Meier's Pirates! (2004).
;
; Comments start with ";" or "#" at the start of a line or after a blank.

; The menu entry
name = Sid Meier's Pirates!
; The controls, shown once the game is on the screen ("\n" starts a new
; line), hint.ru in Russian; without them bare_app's general hint for
; Windows games
hint = L stick  cursor    A/B  mouse buttons    R stick  keypad    R1  keypad 5\nF1  Esc    F2  save    F3  map    F4  status    F5  minimise    F6 (hold)  quit
hint.ru = Л. стик  курсор    A/B  кнопки мыши    П. стик  цифровой блок    R1  5\nF1  Esc    F2  запись    F3  карта    F4  статус    F5  свернуть    F6 (держать)  выход
; The picture of the game on bare_app's home screen: a PNG, square,
; relative to this directory (cover.png when not given)
cover = cover.png
; The program, relative to this directory (or a path of its own:
; C:\windows\notepad.exe), and its arguments
exe = Pirates!.exe
args =
; The Windows desktop's display mode, scaled to the device's screen with
; the aspect kept. Games may switch to any mode of "modes" (640x480,
; 800x600, 1024x768 are always there). Pirates! plays at 800x600: with
; 1024x768 its switch of the display mode crashes WineD3D.
mode = 800x600
modes = 1280x960
; The Windows language and code page: needed by non-English games
locale = ru_RU
; Entries of the game's directory it writes to (saved games, settings),
; blank or comma separated: the game then starts from a copy of its
; directory next to the Wine prefix (/data/wine/games/<directory>), these
; entries copied there on the first start and kept, the rest linked to
; /games, which stays read-only. Pirates! saves in My Documents: none.
;writable = Data
; WINEDLLOVERRIDES: dlls of the game itself before Wine's (n), Wine's (b)
dlls = msvcp71,msvcr71=n,b
; More environment, NAME=value separated by blanks. Box64's x86 code
; blocks as big as possible and CALL/RET without its jump table: the
; tavern of Pirates! went from 26 to 32 fps on the GO Ultra.
; WINE_D3D_CONFIG=HeapMaps=1 (SDK's WineD3D patch): DISCARD/NOOVERWRITE
; maps of Direct3D buffers no longer wait for the render thread; sea
; battles of Pirates! 22-28 -> 25-31 fps. HeapMaps=2 crashes Pirates!.
; WINEBARE_FPS=1 logs the frame rate and the stalls (scene loading).
; WINE_FONT_SCALE=1.25 (SDK's Wine patch): every font the game creates
; that much bigger, for text too small on the device's screen. A game
; that spaces its lines by its own numbers, not by the font, only has
; room for a little: Daemonica (one Palatino font of 15..40 px on a
; fixed line pitch) reads well at 1.25, at 1.5 the lines overlap.
; FREETYPE_PROPERTIES=truetype:interpreter-version=35: fonts hinted as
; Windows hints them. FreeType's default lets some glyphs of the bigger
; sizes reach into the next letter (Daemonica's "c" glued to its
; neighbour); old games drawing their text through GDI want this.
env = BOX64_DYNAREC_BIGBLOCK=3 BOX64_DYNAREC_CALLRET=1 WINE_D3D_CONFIG=HeapMaps=1

[keys]
; Left stick, right stick: mouse (the cursor; the right one slower),
; arrows (arrow keys), wheel (the mouse wheel, right stick up/down),
; numpad (right stick only: the numeric keypad's 8 keys around 5, the
; direction pushed, held while it is out), turn (right stick only: a
; camera that the game turns with the Left and Right keys, held for a
; share of the time as big as the push, so a light push turns slowly;
; up and down are the wheel, as "wheel") or none
stick = mouse
rstick = numpad
; D-pad: arrows, or mouse (the cursor at a slow even speed)
dpad = arrows
; Which arrow keys the arrows (and Insert, Delete, Home, End, Page Up,
; Page Down) are: keypad (the numeric keypad's with NumLock off, as
; before; what Pirates! wants) or cursor (the cursor block's: games that
; read the keyboard by DirectInput and tell them apart, Daemonica).
; kp0..kp9 are always the keypad's.
arrows = keypad
; Cursor speed at full deflection, in screen widths a second
cursor_speed = 0.8
; A button: lbutton, rbutton, mbutton, wheelup, wheeldown, none, or a key:
; a..z 0..9 f1..f24 esc enter space tab backspace shift ctrl alt lshift
; rshift lctrl rctrl lalt ralt up down left right pgup pgdn home end
; insert delete pause capslock kp0..kp9 kp+ kp- kp* kp/ kp. - = , . / ` [ ] ; ' \
; Keys pressed together: ctrl+s. The keypad (kp*) is sent as a PC keyboard
; with NumLock off sends it: kp8 is the keypad's Up.
;
; Pirates! plays on the numeric keypad, so the right stick is the keypad
; (the keys as the game's own key picture shows them) and R1 its 5:
;   duel      7 slash high, 4 thrust, 1 slash low, 8 jump, 2 duck,
;             6 taunt, R1 block
;   dance     8 2 4 6 steps, 7 or 3 turn left, 9 or 1 turn right
;   sailing   4 6 turn, 8 full sail, 2 reef, 9 view, R1 attack
;   battle    the same, 7 chain shot, 1 grape, 3 round shot, R1 or Y fire
; The GO Ultra has no Start/Select and keeps F5 (minimise), F6 (quit):
; F1 Esc (the main menu), F2 F10 (save/load), F3 F6 (the map), F4 F1 (status).
a = lbutton
b = rbutton
x = enter
y = space
l1 = shift+p
r1 = kp5
l2 = shift
r2 = ctrl
select = tab
start = esc
f1 = esc
f2 = f10
f3 = f6
f4 = f1
